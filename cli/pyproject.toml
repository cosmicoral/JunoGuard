[project]
name = "juno-cli"
version = "0.1.0"
description = "JunoGuard CLI — scan before you install, and watch what your agent spends"
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer==0.27.0",
    "rich==15.0.0",
    "httpx==0.28.1",
]

[project.scripts]
juno = "juno_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["juno_cli"]
