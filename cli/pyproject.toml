[project]
name = "juno-cli"
version = "0.1.0"
description = "JunoGuard CLI — scan before you install, and watch what your agent spends"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
]

[project.scripts]
juno = "juno_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["juno_cli"]
