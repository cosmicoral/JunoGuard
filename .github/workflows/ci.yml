name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-security:
    name: Backend security invariants
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install hashed dependencies
        run: pip install --require-hashes -r requirements.txt
      - name: Security-invariant suite
        run: pytest -q

  migrations:
    name: Supabase migrations re-runnable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Postgres
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client
      - name: Verify migrations apply twice
        run: ./supabase/verify_migrations.sh

  client:
    name: TypeScript client audit and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/junoguard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/junoguard/package-lock.json
      - run: npm ci
      - name: npm audit (no high+)
        run: npm audit --audit-level=high
      - run: npm run build
      - run: npm test

  sandbox:
    name: Sandbox images and boundary canaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate npm archive boundary
        run: node --test sandbox/runner.test.mjs
      - name: Build pinned npm worker
        run: docker build -t junoguard-sandbox:latest sandbox
      - name: Build pinned Python worker
        run: docker build -f sandbox/Dockerfile.python -t junoguard-python-sandbox:latest sandbox
      - name: Run networkless canaries
        run: bash sandbox/run-canaries.sh

  frontend:
    name: Frontend audit, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: npm audit (no high+)
        run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build
      - name: Mode-label smoke check
        run: npm run smoke
