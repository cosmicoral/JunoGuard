[project]
name = "juno-mcp"
version = "0.1.0"
description = "JunoGuard MCP server — supply-chain and token supervision for AI coding agents"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
    "httpx>=0.27",
]

[project.scripts]
juno-mcp = "juno_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["juno_mcp"]
